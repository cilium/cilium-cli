name: Release Image Build

# Any change in triggers needs to be reflected in the concurrency group.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.after }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'cilium/cilium-cli' }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      repo_tags: ${{ steps.tag.outputs.repo_tags }}
      digest: ${{ steps.docker_build.outputs.digest }}

    steps:
      - name: Getting image tag
        id: tag
        run: |
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "repo_tags=quay.io/${{ github.repository_owner }}/cilium-cli:latest,quay.io/${{ github.repository_owner }}/cilium-cli:${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # SECURITY: Checking out trusted code from a signed tag
      # This workflow only runs on pushed tags to the main repository.
      # Tags should be signed and verified before pushing to ensure code integrity.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker_build
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          tags: quay.io/${{ github.repository_owner }}/cilium-cli:${{ steps.tag.outputs.tag }}
          outputs: type=oci,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  push:
    needs: build
    if: ${{ github.repository == 'cilium/cilium-cli' }}
    permissions:
      contents: read
      # Required to generate OIDC tokens
      id-token: write
    runs-on: ubuntu-24.04
    # Also decides the subject of the OIDC token, see the login steps below.
    environment:
      name: release
      deployment: false

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      # Quay's registry endpoint only accepts credentials or a JWT signed by
      # Quay itself, so the GitHub OIDC token cannot be used as the registry
      # password directly. Trade it for a short lived robot token first.
      #
      # Because the job references an environment, the subject of the token is
      # repo:cilium@21054566/cilium-cli@323610158:environment:release, the
      # immutable form that carries the owner and repository ids. That is the
      # identity federated with the robot account on the Quay side, so renaming
      # the environment breaks the login.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Push image to registry
        env:
          QUAY_USERNAME: ${{ vars.QUAY_ROBOT_RELEASE }}
          QUAY_PASSWORD: ${{ steps.registry-token.outputs.token }}
        run: |
          for tag in $(echo "${{ needs.build.outputs.repo_tags }}" | tr ',' '\n'); do
            skopeo copy \
              --multi-arch all \
              --dest-creds "${QUAY_USERNAME}:${QUAY_PASSWORD}" \
              oci-archive:/tmp/image.tar \
              "docker://${tag}"
          done
